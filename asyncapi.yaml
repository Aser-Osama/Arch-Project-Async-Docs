asyncapi: 2.6.0
info:
  title: Video Platform Event Bus
  version: 1.0.0
  description: |
    AsyncAPI documentation for the asynchronous events used in the video streaming platform.
    Events are emitted and consumed across services for tasks such as video processing, personalization, and content moderation.

servers:
  kafkaBroker:
    url: kafka-broker:9092
    protocol: kafka

defaultContentType: application/json

channels:
  video.transcoding.complete:
    description: Event published after a video is transcoded successfully.
    subscribe:
      summary: Transcoded video notification
      operationId: onTranscodeComplete
      message:
        name: VideoTranscodingComplete
        title: Video Transcoding Complete
        payload:
          type: object
          properties:
            videoId:
              type: string
            resolutions:
              type: array
              items:
                type: string
              example: ["480p", "720p", "1080p"]
            cdnUrl:
              type: string
              format: uri

  video.uploaded:
    description: Event published when a user successfully uploads a new video.
    subscribe:
      summary: Handle new video event (e.g., recommendations, notifications)
      operationId: onVideoUploaded
      message:
        name: VideoUploaded
        title: New Video Uploaded
        payload:
          type: object
          properties:
            videoId:
              type: string
            uploaderId:
              type: string
            tags:
              type: array
              items:
                type: string
            visibility:
              type: string
              enum: [public, unlisted, private]
            uploadTimestamp:
              type: string
              format: date-time

  user.watch.event:
    description: Event emitted when a user watches a video (used for analytics and recommendation).
    publish:
      summary: Send video watch interaction data
      operationId: publishWatchEvent
      message:
        name: VideoWatchEvent
        title: User Watched Video
        payload:
          type: object
          properties:
            userId:
              type: string
            videoId:
              type: string
            watchDuration:
              type: integer
              description: Duration in seconds
            timestamp:
              type: string
              format: date-time

  recommendation.feedback:
    description: Event published when a user provides feedback on a recommendation.
    publish:
      summary: Submit recommendation feedback
      operationId: publishRecommendationFeedback
      message:
        name: RecommendationFeedback
        title: User Recommendation Feedback
        payload:
          type: object
          properties:
            userId:
              type: string
            videoId:
              type: string
            feedback:
              type: string
              enum: [not_interested, misleading, offensive]
            timestamp:
              type: string
              format: date-time

  content.flagged:
    description: Event triggered when content is flagged by moderation AI or users.
    publish:
      summary: Send content flagging event
      operationId: publishContentFlag
      message:
        name: ContentFlagged
        title: Content Flagged
        payload:
          type: object
          properties:
            videoId:
              type: string
            flaggedBy:
              type: string
            reason:
              type: string
              enum: [nudity, violence, hate_speech, copyright]
            detectedBy:
              type: string
              enum: [user, ai]
            timestamp:
              type: string
              format: date-time

components:
  messages: {}
  schemas: {}
